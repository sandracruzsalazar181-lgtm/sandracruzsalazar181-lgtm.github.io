<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Proyecto Final - Modelo SIR y Cuadráticas</title>

<style>
body{
    margin:0;
    font-family:'Segoe UI',sans-serif;
    background:linear-gradient(135deg,#1f1c2c,#928dab);
    color:white;
    text-align:center;
}

header{
    padding:25px;
    background:rgba(0,0,0,0.4);
}

section{
    margin:30px auto;
    padding:25px;
    width:85%;
    background:rgba(255,255,255,0.1);
    border-radius:15px;
}

h2{
    color:#00ffff;
}

button{
    padding:10px 20px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
    background:#00ffff;
    margin-top:10px;
}

input{
    padding:6px;
    border-radius:5px;
    border:none;
    width:80px;
    text-align:center;
}

.resultado{
    margin-top:20px;
    font-size:17px;
    line-height:1.6;
}
</style>
</head>

<body>

<header>
<h1>Modelación Matemática de Enfermedades Infecciosas</h1>
<p>Proyecto Final</p>
</header>

<section>
<h2>Modelo SIR - Resolución Paso a Paso</h2>

<p><b>Ingresa los datos:</b></p>

S = <input type="number" id="S" value="990">
I = <input type="number" id="I" value="10">
R = <input type="number" id="R" value="0">
<br><br>
β = <input type="number" step="0.1" id="beta" value="0.3">
γ = <input type="number" step="0.1" id="gamma" value="0.1">
<br><br>
Población total N = <input type="number" id="N" value="1000">

<br><br>
<button onclick="resolverSIR()">Resolver Paso a Paso</button>

<div id="sirResultado" class="resultado"></div>
</section>

<section>
<h2>Ecuaciones Cuadráticas - Paso a Paso</h2>

<h3 id="ecuacion"></h3>

<button onclick="mostrarPasos()">Mostrar Resolución</button>

<div id="pasos" class="resultado"></div>

<hr>

<p>Ingresa una solución:</p>
<input type="number" step="any" id="respuesta">
<button onclick="verificar()">Verificar</button>

<div id="resultado" class="resultado"></div>

<button onclick="generarEjercicio()">Nuevo Ejercicio</button>

</section>

<script>

// -------- MODELO SIR PASO A PASO --------

function resolverSIR(){

let S = parseFloat(document.getElementById("S").value);
let I = parseFloat(document.getElementById("I").value);
let R = parseFloat(document.getElementById("R").value);
let beta = parseFloat(document.getElementById("beta").value);
let gamma = parseFloat(document.getElementById("gamma").value);
let N = parseFloat(document.getElementById("N").value);

let nuevosInfectados = beta * S * I / N;
let nuevosRecuperados = gamma * I;

let nuevoS = S - nuevosInfectados;
let nuevoI = I + nuevosInfectados - nuevosRecuperados;
let nuevoR = R + nuevosRecuperados;

document.getElementById("sirResultado").innerHTML =

"<b>Paso 1: Nuevos infectados</b><br>" +
"β × S × I / N = " + beta + " × " + S + " × " + I + " / " + N +
"<br>= " + nuevosInfectados.toFixed(2) +

"<br><br><b>Paso 2: Nuevos recuperados</b><br>" +
"γ × I = " + gamma + " × " + I +
"<br>= " + nuevosRecuperados.toFixed(2) +

"<br><br><b>Paso 3: Actualizar valores</b><br>" +
"S nuevo = " + S + " - " + nuevosInfectados.toFixed(2) +
" = " + nuevoS.toFixed(2) +

"<br>I nuevo = " + I + " + " + nuevosInfectados.toFixed(2) +
" - " + nuevosRecuperados.toFixed(2) +
" = " + nuevoI.toFixed(2) +

"<br>R nuevo = " + R + " + " + nuevosRecuperados.toFixed(2) +
" = " + nuevoR.toFixed(2);
}


// -------- ECUACIONES CUADRÁTICAS --------

let a,b,c,sol1,sol2,disc;

function generarEjercicio(){

a = Math.floor(Math.random()*4)+1;
b = Math.floor(Math.random()*10)-5;
c = Math.floor(Math.random()*10)-5;

disc = b*b - 4*a*c;

while(disc < 0){
c = Math.floor(Math.random()*10)-5;
disc = b*b - 4*a*c;
}

sol1 = (-b + Math.sqrt(disc))/(2*a);
sol2 = (-b - Math.sqrt(disc))/(2*a);

document.getElementById("ecuacion").innerHTML =
a + "x² + " + b + "x + " + c + " = 0";

document.getElementById("pasos").innerHTML = "";
document.getElementById("resultado").innerHTML = "";
document.getElementById("respuesta").value = "";
}

function mostrarPasos(){

document.getElementById("pasos").innerHTML =
"<b>Paso 1:</b> a=" + a + ", b=" + b + ", c=" + c +

"<br><br><b>Paso 2:</b> Δ = b² - 4ac = " + disc +

"<br><br><b>Paso 3:</b> x = (-b ± √Δ)/2a" +

"<br>x₁ = " + sol1.toFixed(2) +
"<br>x₂ = " + sol2.toFixed(2);
}

function verificar(){

let user = parseFloat(document.getElementById("respuesta").value);

if(Math.abs(user - sol1) < 0.2 || Math.abs(user - sol2) < 0.2){
document.getElementById("resultado").innerHTML =
"<span style='color:lightgreen;'>Correcto ✅</span>";
}else{
document.getElementById("resultado").innerHTML =
"<span style='color:red;'>Incorrecto ❌</span>";
}
}

generarEjercicio();

</script>

</body>
</html>
